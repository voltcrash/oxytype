name: Daily production release

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: oxytype-production-release
  cancel-in-progress: false

env:
  PNPM_VERSION: "12.8.1"
  NODE_VERSION: "24.21.0"
  CI: "true"

jobs:
  release:
    if: github.repository == 'voltcrash/oxytype' && github.ref == 'refs/heads/main'
    name: Deploy production and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://oxytype.voltcrash.com
    steps:
      - name: Check out the run's main snapshot
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Plan date release and changes
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { prepareDailyRelease } = await import(`${process.env.GITHUB_WORKSPACE}/packages/release/src/daily-release.js`);
            const plan = await prepareDailyRelease({ github, context, cwd: process.env.GITHUB_WORKSPACE });
            for (const key of ['version', 'tag', 'sha', 'shouldDeploy']) core.setOutput(key, plan[key]);
            if (plan.shouldDeploy) {
              require('node:fs').writeFileSync(`${process.env.RUNNER_TEMP}/daily-release-notes.md`, plan.body);
              require('node:fs').writeFileSync(`${process.env.GITHUB_WORKSPACE}/frontend/static/release.json`, `${JSON.stringify(plan.releaseHistory, null, 2)}\n`);
            } else {
              await core.summary.addRaw(`Release ${plan.tag} already deployed; skipping this run.`).write();
            }

      - name: Set up Node.js
        if: steps.plan.outputs.shouldDeploy == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        if: steps.plan.outputs.shouldDeploy == 'true'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Prepare production credentials and build settings
        if: steps.plan.outputs.shouldDeploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BACKEND_ENV: ${{ secrets.PRODUCTION_BACKEND_ENV }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          PRODUCTION_FRONTEND_ENV: ${{ vars.PRODUCTION_FRONTEND_ENV }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const key of ['CLOUDFLARE_API_TOKEN', 'PRODUCTION_BACKEND_ENV', 'PRODUCTION_FRONTEND_ENV']) {
            if (!process.env[key]?.trim()) throw new Error(`Configure the production Actions input ${key}`);
          }
          const dashboardApiKey = process.env.BETTER_AUTH_API_KEY?.trim();
          const backendEnv = process.env.PRODUCTION_BACKEND_ENV + (dashboardApiKey ? `\nBETTER_AUTH_API_KEY=${JSON.stringify(dashboardApiKey)}\n` : '');
          writeFileSync('backend/.dev.vars.production', backendEnv, { mode: 0o600 });
          writeFileSync('frontend/.env.production.local', process.env.PRODUCTION_FRONTEND_ENV, { mode: 0o600 });
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          pkg.version = process.env.RELEASE_VERSION;
          writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install dependencies
        if: steps.plan.outputs.shouldDeploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build production frontend and Worker
        if: steps.plan.outputs.shouldDeploy == 'true'
        run: pnpm --filter @oxytype/backend build:production-site

      - name: Check production deployment
        if: steps.plan.outputs.shouldDeploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @oxytype/backend deploy:production-dry-run

      - name: Apply production D1 migrations
        if: steps.plan.outputs.shouldDeploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @oxytype/backend db:migrate:production

      - name: Deploy production with Wrangler
        if: steps.plan.outputs.shouldDeploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: pnpm --filter @oxytype/backend deploy:production-site --var "VERSION:$RELEASE_VERSION"

      - name: Publish GitHub release after deployment
        if: steps.plan.outputs.shouldDeploy == 'true'
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
        with:
          script: |
            const { publishDailyRelease } = await import(`${process.env.GITHUB_WORKSPACE}/packages/release/src/daily-release.js`);
            const { data: release } = await publishDailyRelease({
              github, context,
              version: process.env.RELEASE_VERSION,
              tag: process.env.RELEASE_TAG,
              sha: process.env.RELEASE_SHA,
              body: require('node:fs').readFileSync(`${process.env.RUNNER_TEMP}/daily-release-notes.md`, 'utf8'),
            });
            await core.summary.addLink(release.name, release.html_url).write();

      - name: Remove private settings
        if: always()
        run: rm -f backend/.dev.vars.production frontend/.env.production.local
