name: Terminal npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "UTC date version (YY.M.D); blank uses today. Optional -rc.N suffix."
        required: false
        type: string
      channel:
        description: npm dist-tag
        required: true
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: terminal-npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
          run-install: false
          # Bun is the tui runtime, pinned by setup-bun; don't let vp shim it.
          package-manager: |
            bun: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Plan terminal publication
        id: plan
        uses: actions/github-script@v9.0.0
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        with:
          script: |
            const { prepareTerminalRelease } = await import(`${process.env.GITHUB_WORKSPACE}/packages/release/src/terminal-release.js`);
            const plan = await prepareTerminalRelease({
              cwd: process.env.GITHUB_WORKSPACE,
              sha: context.sha,
              version: process.env.REQUESTED_VERSION,
              channel: process.env.RELEASE_CHANNEL,
            });
            core.setOutput('shouldPublish', String(plan.shouldPublish));
            core.setOutput('version', plan.version);
            core.setOutput('channel', plan.channel);
            if (!plan.shouldPublish) core.notice('This commit/version is already published.');

      - name: Validate terminal source
        if: steps.plan.outputs.shouldPublish == 'true'
        run: vp run lint-tui && vp run test-tui && vp run --filter @oxytype/release test

      - name: Build and smoke isolated npm package
        if: steps.plan.outputs.shouldPublish == 'true'
        run: vp run --filter @voltcrash/oxytype package-check

      - name: Publish terminal package
        if: steps.plan.outputs.shouldPublish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.plan.outputs.channel }}
        # npm directly: publishes the prebuilt dist/npm dir (not a workspace
        # package) with npm provenance; vp pm publish would forward to pnpm.
        run: npm publish ./tui/dist/npm --access public --provenance --tag "$RELEASE_CHANNEL"
