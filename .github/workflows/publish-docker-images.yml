name: Publish Oxytype Docker images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    env:
      BE_REPO: ghcr.io/${{ github.repository }}-backend
      FE_REPO: ghcr.io/${{ github.repository }}-frontend
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BE_REPO }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and publish backend
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          file: ./docker/backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: |
            server_version=${{ github.event.release.tag_name }}

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FE_REPO }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and publish frontend
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          file: ./docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
