packages:
  - frontend
  - backend
  - packages/*
  - frontend/storybook

allowBuilds:
  "@firebase/util": true
  "@fortawesome/fontawesome-free": true
  "@parcel/watcher": true
  "@sentry/cli": true
  bcrypt: true
  core-js: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  re2: true
  ssh2: true

overrides:
  "postcss": "8.5.8"
  vite@*: "catalog:"
  vitest@*: "catalog:"
engineStrict: true
saveExact: true
savePrefix: ""
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.2
  vite-plus: 1.0.0
  "@vitest/coverage-v8": 5.0.2
  "@vitest/browser-playwright": 5.0.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/db-ivm@0.1.24"
  - "@tanstack/db@0.11.0"
  - "@tanstack/query-db-collection@1.3.1"
  - "@tanstack/solid-db@0.3.0"
  - firebase-tools@15.32.1
  - bullmq@6.3.11
  - dotenv@18.0.5
  - "@redocly/cli@2.57.0"
  - "@chromatic-com/storybook@5.4.0"
