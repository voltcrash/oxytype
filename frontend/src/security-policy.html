<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Security Policy | Oxytype</title>
    <meta
      name="description"
      content="Security Policy information for the independent Oxytype project."
    />
    <link rel="icon" type="image/svg+xml" href="/images/favicon/oxytype.svg" />
    <link rel="stylesheet" href="styles/standalone.scss" />
    <link rel="stylesheet" href="styles/tailwind.css" />
  </head>
  <body class="min-h-screen bg-bg text-text">
    <div class="mx-auto max-w-3xl px-6 py-10">
      <header class="mb-12">
        <a
          class="flex items-center gap-3 text-2xl text-text no-underline"
          href="/"
        >
          <img
            src="/images/favicon/oxytype.svg"
            alt=""
            width="40"
            height="40"
          />
          <span>oxytype</span>
        </a>
      </header>
      <main class="grid gap-6">
        <h1 class="text-3xl text-main">Security Policy</h1>
        <p>
          Oxytype handles security reports through its own repository. Please
          read the current repository security policy for private reporting
          instructions.
        </p>
        <p>Do not post vulnerability details in a public issue.</p>
        <p>
          <a
            class="text-main underline"
            href="https://github.com/voltcrash/oxytype/security/policy"
          >
            Read the security policy
          </a>
        </p>
        <a class="text-sub underline" href="/">Back to Oxytype</a>
      </main>
    </div>
  </body>
</html>
