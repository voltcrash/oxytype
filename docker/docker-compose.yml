services:
  oxytype-frontend:
    image: ghcr.io/voltcrash/oxytype-frontend:latest
    restart: on-failure
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      OXYTYPE_BACKEND_URL: ${OXYTYPE_BACKEND_URL:?Set the Worker API URL including /api}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 5s
      timeout: 10s
      retries: 15
