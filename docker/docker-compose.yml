services:
  oxytype-proxy:
    container_name: oxytype-proxy
    image: traefik:v3.7.13
    restart: on-failure
    depends_on:
      oxytype-backend:
        condition: service_healthy
      oxytype-frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      #Dashboard disabled for security (uncomment only for debugging behind VPN)
      #- "8080:8080"
    networks:
      - public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # enable for HTTPS
      #- "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      #- "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      #- "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      #- "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      #- "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # for debugging only
      #- "--api.insecure=true"
      #- "--log.level=DEBUG"

  oxytype-frontend:
    container_name: oxytype-frontend
    image: ghcr.io/voltcrash/oxytype-frontend:latest
    #uncomment if you want to expose the frontend server directly (not recommended)
    #ports:
    #  - "${FRONTEND_PORT:-8080}:80"
    restart: on-failure
    networks:
      - public
    labels:
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.routers.frontend.priority=25"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # enable for HTTPS
      #- "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      #- "traefik.http.routers.frontend.tls=true"
      #- "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      #- "traefik.http.routers.frontend.tls.domains[0].main=${DOMAIN}"
    env_file:
      - path: ./.env
        required: true
    environment:
      - OXYTYPE_BACKEND_URL=${BASE_URL:-http://localhost}/api
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s

  oxytype-backend:
    container_name: oxytype-backend
    image: ghcr.io/voltcrash/oxytype-backend:latest
    #uncomment if you want to expose the backend server (not recommended)
    #ports:
    #  - "${BACKEND_PORT:-5005}:5005"
    networks:
      - public # access to the internet, OAuth providers
      - isolated # access to the databases
    restart: on-failure
    environment:
      - DB_NAME=oxytype
      - DB_URI=mongodb://oxytype-mongodb:27017
      - REDIS_URI=redis://oxytype-redis:6379
      - FRONTEND_URL=${BASE_URL:-http://localhost}
      - BETTER_AUTH_URL=${BASE_URL:-http://localhost}/api/auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to a random secret of at least 32 characters}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - RECAPTCHA_SECRET=${RECAPTCHA_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
    volumes:
      - type: bind
        source: ./backend-configuration.json
        target: /app/backend/dist/backend-configuration.json
        read_only: true
    depends_on:
      oxytype-redis:
        condition: service_healthy
      oxytype-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5005"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s
    labels:
      - "traefik.http.middlewares.backend-prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.backend-headers.headers.customrequestheaders.CF-Connecting-IP="
      - "traefik.http.routers.backend.middlewares=backend-prefix,backend-headers"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=5005"
      - "traefik.enable=true"
      - "traefik.docker.network=oxytype-public"

  oxytype-redis:
    container_name: oxytype-redis
    image: redis:8.10.2
    #uncomment if you want to expose the redis server (not recommended)
    #ports:
    #  - "${REDIS_PORT:-6379}:6379"
    networks:
      - isolated
      #uncomment if you want to expose the redis server (not recommended)
      #- public
    restart: on-failure
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  oxytype-mongodb:
    container_name: oxytype-mongodb
    image: mongo:9.0.2
    restart: on-failure
    volumes:
      - mongo-data:/data/db
    #uncomment if you want to expose the mongodb server (not recommended)
    #ports:
    #  - "${MONGO_PORT:-27017}:27017"
    networks:
      - isolated
      #uncomment if you want to expose the mongodb server (not recommended)
      #- public
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

volumes:
  mongo-data:
    name: oxytype_mongo_data
  redis-data:
    name: oxytype_redis_data

networks:
  isolated:
    name: oxytype-isolated
    internal: true
  public:
    name: oxytype-public
